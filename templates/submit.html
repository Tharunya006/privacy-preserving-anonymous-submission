<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Anonymous Report</title>
</head>

<body>

    <h1>Anonymous Submission</h1>

    <p>
        Submit your information without creating an identifiable account.
    </p>

    <form method="POST" action="/submit" enctype="multipart/form-data">
        <label for="title">Report Title:</label><br>
        <input type="text" id="title" name="title" required>

        <br><br>

        <label for="content">Report:</label><br>
        <textarea id="content" name="content" rows="10" cols="50" required></textarea>

        <br><br>

        <label for="evidence">Evidence:</label><br>
        <input type="file" id="evidence" name="evidence">

        <br><br>

        <button type="submit">Submit Report</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
